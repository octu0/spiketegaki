<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spiketegaki デモ</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --line: #d8d4cc;
    /* 十字 (中心の目安) は従、内枠 (em の目安) は主。内枠の方を濃くする */
    --cross: #e6e3dc;
    --guide: #c7c1b4;
    --ink: #1c1b18;
    --sub: #6b665d;
    --accent: #3b6ea5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .lead { margin: 0 0 20px; color: var(--sub); font-size: 0.9rem; }

  .columns { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
  }
  .card h2 { font-size: 0.8rem; margin: 0 0 10px; color: var(--sub); font-weight: 600; letter-spacing: .04em; }

  /* マス目。枠・十字・内枠はすべて canvas の背景か外側の要素なので、描いた墨とは混ざらない */
  #pad {
    display: block;
    width: 256px;
    height: 256px;
    touch-action: none;
    cursor: crosshair;
    background-color: #fff;
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), var(--cross) calc(50% - 1px), var(--cross) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--cross) calc(50% - 1px), var(--cross) calc(50% + 1px), transparent calc(50% + 1px));
    border: 2px solid var(--ink);
    border-radius: 4px;
  }

  /* 内枠 (em の目安)。マス目の中央 85%。
     フォントから作った学習データでは字の高さがマス目の 0.81〜0.88 に集まるので、
     この枠いっぱいに書くと学習時と同じ大きさになる。小さく書くと小書き仮名 (ケ と ヶ など)
     と見分けがつかなくなる。 */
  #padFrame {
    position: relative;
    display: inline-block;
    font-size: 0;
  }
  #padFrame::after {
    content: "";
    position: absolute;
    /* canvas の枠 2px の内側がマス目そのもの。そこから中央 85% に縮める */
    top: 2px;
    right: 2px;
    bottom: 2px;
    left: 2px;
    transform: scale(0.85);
    border: 1px solid var(--guide);
    pointer-events: none;
  }
  #preview {
    display: block;
    width: 128px;
    height: 128px;
    image-rendering: pixelated;
    border: 1px solid var(--line);
    background: #fff;
  }

  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  button {
    font: inherit;
    padding: 6px 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: #f0eee9; }

  #status { font-size: 0.85rem; color: var(--sub); min-height: 1.6em; }
  #timing { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--sub); }

  ol#results { list-style: none; margin: 0; padding: 0; min-width: 280px; }
  ol#results li {
    display: grid;
    grid-template-columns: 2.4rem 1fr 4.2rem;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid var(--line);
  }
  ol#results li:last-child { border-bottom: none; }
  .glyph { font-size: 1.8rem; line-height: 1; text-align: center; }
  .bar { height: 8px; background: #eae7e0; border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--sub); }
  .empty { color: var(--sub); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>spiketegaki — SNN 手書き 1 文字認識 (wasm)</h1>
  <p class="lead">
    <strong>内枠いっぱいに 1 文字書いてください。</strong>内枠は em の目安で、学習データの字の大きさに合わせてあります。
    小さく書くと小書き仮名 (ケ と ヶ、よ と ょ) と見分けがつきません。ペンを離して 150 ms 後に自動で認識します。
    推論は SwiftWasm でビルドした純 Swift の SNN が、このページの中で走ります。
  </p>

  <div class="columns">
    <div class="card">
      <h2>マス目 (256 x 256) / 内枠 = em の目安</h2>
      <div id="padFrame"><canvas id="pad" width="256" height="256"></canvas></div>
      <div class="row">
        <button id="clear" type="button">クリア</button>
        <span id="timing"></span>
      </div>
    </div>

    <div class="card" style="flex: 1 1 280px;">
      <h2>候補 (top-5)</h2>
      <ol id="results"><li class="empty">まだ認識していません</li></ol>
    </div>

    <div class="card">
      <h2>正規化結果 (32 x 32)</h2>
      <canvas id="preview" width="32" height="32"></canvas>
    </div>
  </div>

  <p id="status">読み込み中…</p>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
